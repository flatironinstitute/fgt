name: Build and test fgt Python wheels

on:
  schedule:
    - cron: "0 0 * * 0"   # weekly Sunday 00:00 UTC
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to PyPI after build?"
        type: boolean
        required: false
        default: false

jobs:
  build_wheels:
    name: Build fgt wheels on ${{ matrix.buildplat[1] }}
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - [ ubuntu-22.04,  manylinux_x86_64 ]
          - [ ubuntu-22.04,  musllinux_x86_64 ]
          - [ macos-14,      macosx_arm64 ]
          - [ windows-2022,  win_amd64 ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Windows toolchain
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          c:\msys64\usr\bin\pacman.exe -Sy --noconfirm `
            mingw-w64-x86_64-gcc `
            mingw-w64-x86_64-gcc-fortran `
            mingw-w64-x86_64-fftw `
            mingw-w64-x86_64-openblas `
            mingw-w64-x86_64-pkgconf
          echo "c:\msys64\mingw64\bin;" >> $env:GITHUB_PATH

      - name: Install macOS toolchain
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install fftw gcc@15

      - name: Build wheels (${{ matrix.buildplat[1] }})
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: '.'
        env:
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_LINUX: auto64
          CIBW_ARCHS_WINDOWS: auto64
          CIBW_BUILD: '*-${{ matrix.buildplat[1] }}'

      - uses: actions/upload-artifact@v4
        with:
          name: fgt-wheels-${{ matrix.buildplat[1] }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: fgt-sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write   # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
