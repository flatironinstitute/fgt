[build-system]
requires = ["setuptools>=64", "wheel", "numpy>=1.22"]
build-backend = "setuptools.build_meta"

[project]
name = "fgt"
version = "0.1.0"
description = "Point and box fast Gauss transforms in 1, 2, 3 dimensions."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "fgt contributors" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/sj90101/fgt"
Repository = "https://github.com/sj90101/fgt"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]

[tool.setuptools]
packages = ["fgt"]
package-dir = { "fgt" = "python/fgt" }

[tool.setuptools.package-data]
fgt = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *_i686 *_ppc64le *_s390x *_armv7l"
test-requires = "pytest"
test-command = "pytest {project}/python/tests"

[tool.cibuildwheel.linux]
# manylinux_2_28 (Almalinux 8) has dnf, gcc-toolset, and modern packages.
# We pin to it because the default manylinux2014 ships gcc-4.8 which is too
# old for our gfortran needs (we require >= 10).
manylinux-x86_64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
# Use TOML literal multiline string ('''...''') so backslash-newline shell
# continuations don't need TOML escaping. The double-quoted form ("""...""")
# is mis-parsed by Ruby toml-rb (used by Dependabot's dependency-graph
# updater): a `\\<newline><whitespace>d` sequence inside `"""..."""` is
# erroneously treated as the reserved escape `\d` and aborts the parse.
before-all = '''
if command -v dnf >/dev/null 2>&1; then \
    dnf install -y gcc-toolset-13 gcc-toolset-13-gcc-gfortran fftw-devel openblas-devel make git && \
    echo 'source /opt/rh/gcc-toolset-13/enable' > /etc/profile.d/gcc-toolset.sh; \
elif command -v apk >/dev/null 2>&1; then \
    apk add --no-cache fftw-dev openblas-dev gfortran gcc g++ make git; \
else \
    apt-get update && apt-get install -y libfftw3-dev libopenblas-dev gfortran make git; \
fi
'''
environment = { PATH = "/opt/rh/gcc-toolset-13/root/usr/bin:$PATH", LD_LIBRARY_PATH = "/opt/rh/gcc-toolset-13/root/usr/lib64:$LD_LIBRARY_PATH" }
before-build = "bash {project}/python/scripts/build-libfgt.sh"

[tool.cibuildwheel.macos]
# Toolchain is installed by the workflow (brew step) before cibuildwheel runs;
# this before-build only builds libfgt. CIBW handles delocate-wheel afterwards.
before-build = "bash {project}/python/scripts/build-libfgt.sh"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.cibuildwheel.windows]
# Toolchain is installed by the workflow (pacman step) before cibuildwheel runs.
# cibuildwheel does not vendor DLLs into Windows wheels by default, so we
# install delvewheel and run `delvewheel repair` to bundle the MinGW runtime
# (libgcc_s_seh, libwinpthread, libstdc++, libgfortran, libgomp, libquadmath)
# plus libfftw3-3, libfftw3f-3, libopenblas from C:\msys64\mingw64\bin into
# the wheel. Same pattern as flatironinstitute/finufft. --analyze-existing
# tells delvewheel to recurse on libfgt.dll's transitive deps using the
# environment PATH (which the `environment` block below adds the MinGW bin
# dir to).
before-build = "pip install delvewheel && bash {project}/python/scripts/build-libfgt.sh"
repair-wheel-command = "delvewheel repair -v --analyze-existing -w {dest_dir} {wheel}"
environment = { CC = "gcc", CXX = "g++", FC = "gfortran", PATH = "C:\\\\msys64\\\\mingw64\\\\bin;$PATH" }
